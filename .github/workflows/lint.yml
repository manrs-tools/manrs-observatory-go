name: Lint
on:
  pull_request:
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".golangci.yml"

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      # Give the default GITHUB_TOKEN write permission to commit and push the
      # added or changed files to the repository.
      contents: write
      # Allow lint annotations in the PR.
      pull-requests: read

    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          # Don't leave the write token in .git/config while dependency code (go mod download,
          # golangci-lint) runs; the commit step authenticates only at push time.
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: '^1.25.0'

      - name: Download dependencies
        run: go mod download

      - name: Install gofumpt
        run: go install mvdan.cc/gofumpt@latest

      - name: Format code
        run: gofumpt -w .

      - name: Run golangci-lint (fix)
        uses: golangci/golangci-lint-action@v9
        with:
          args: --fix --issues-exit-code=0 --timeout=5m
          install-mode: goinstall
          version: latest

      - name: Commit lint fixes
        # Only same-repo PRs (fork PRs get a read-only token that cannot push). The write token is
        # scoped to this step and injected straight into the push URL, so it is never persisted in
        # .git/config during the untrusted install/lint steps above. The check-mode lint below
        # still gates the PR either way.
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No lint fixes to commit."
            exit 0
          fi
          git config user.name "GCA Bot"
          git config user.email "94362713+gca-bot@users.noreply.github.com"
          git add -A
          git commit -m "chore: apply linter fixes and formatting"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${HEAD_REF}"

      - name: Run golangci-lint (check)
        uses: golangci/golangci-lint-action@v9
        with:
          args: --timeout=5m
          install-mode: goinstall
          version: latest
