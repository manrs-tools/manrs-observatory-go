name: Release
on:
  release:
    types: [ released ]

jobs:
  binary:
    name: Build and Release Binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '^1.25.0'

      - name: Build Binaries
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # The tag flows into -ldflags, so strip anything that isn't a plain version string
          # before it reaches the build.
          TAG_NAME="$(printf '%s' "$TAG" | tr -cd '[:alnum:].-')"
          mkdir -p builds/compressed
          go install github.com/mitchellh/gox@latest
          cd cmd/client
          gox --output "../../builds/manrs-observatory-{{.OS}}-{{.Arch}}" -ldflags "-s -w -X main.version=${TAG_NAME}" -osarch 'darwin/amd64 darwin/arm64 linux/amd64 linux/arm freebsd/amd64 windows/amd64'
          cd ../../builds
          find . -maxdepth 1 -type f -execdir zip 'compressed/{}.zip' '{}' \;

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: builds/compressed/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  setup:
    name: Setup Build Metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image_id: ${{ steps.setenv.outputs.image_id }}
      cache_tags: ${{ steps.setenv.outputs.cache_tags }}
      tags: ${{ steps.setenv.outputs.tags }}
      tags_latest: ${{ steps.setenv.outputs.tags_latest }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - id: setenv
        run: |
          IMAGE_ID=${GITHUB_REPOSITORY,,}
          TAG_NAME="$(echo "${{ github.ref_name }}" | tr -cd '[:alnum:].-')"

          TAGS="ghcr.io/${IMAGE_ID}:${TAG_NAME}"
          TAGS_LATEST="ghcr.io/${IMAGE_ID}:latest"
          CACHE_TAGS="ghcr.io/${IMAGE_ID}:buildcache"

          echo "image_id=$IMAGE_ID" >> $GITHUB_OUTPUT
          echo "tags=$TAGS" >> $GITHUB_OUTPUT
          echo "tags_latest=$TAGS_LATEST" >> $GITHUB_OUTPUT
          echo "cache_tags=$CACHE_TAGS" >> $GITHUB_OUTPUT

  build-amd64:
    name: Build amd64 image
    runs-on: ubuntu-latest
    needs: setup
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true
          driver-opts: |
            network=host

      - name: Build amd64 image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ needs.setup.outputs.image_id }}:amd64
          cache-from: type=registry,ref=${{ needs.setup.outputs.cache_tags }}
          cache-to: type=registry,ref=${{ needs.setup.outputs.cache_tags }},mode=max

  build-arm64:
    name: Build arm64 image
    runs-on: ubuntu-24.04-arm
    needs: setup
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true
          driver-opts: |
            network=host

      - name: Build arm64 image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/arm64
          tags: ghcr.io/${{ needs.setup.outputs.image_id }}:arm64
          cache-from: type=registry,ref=${{ needs.setup.outputs.cache_tags }}
          cache-to: type=registry,ref=${{ needs.setup.outputs.cache_tags }},mode=max

  merge:
    name: Merge multi-arch image
    runs-on: ubuntu-latest
    needs: [ setup, build-amd64, build-arm64 ]
    permissions:
      packages: write
    outputs:
      image_tag: ${{ needs.setup.outputs.tags }}
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        run: |
          docker buildx imagetools create \
            -t ${{ needs.setup.outputs.tags }} \
            -t ${{ needs.setup.outputs.tags_latest }} \
            ghcr.io/${{ needs.setup.outputs.image_id }}:amd64 \
            ghcr.io/${{ needs.setup.outputs.image_id }}:arm64

      - name: Verify manifest
        run: |
          docker buildx imagetools inspect ${{ needs.setup.outputs.tags }}
